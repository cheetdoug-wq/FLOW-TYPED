name: Unzip project
on:
  push:
    paths:
      - '.github/workflows/unzip.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip into the repository
        run: |
          set -e
          zipfile=$(ls -t *.zip | head -n 1)
          rm -rf /tmp/unpacked && mkdir /tmp/unpacked
          unzip -q "$zipfile" -d /tmp/unpacked
          src=/tmp/unpacked
          if [ ! -f "$src/package.json" ]; then src=$(dirname "$(find /tmp/unpacked -maxdepth 2 -name package.json | head -n 1)"); fi
          cp -a "$src"/. .
          rm -f ./*.zip
      - name: Commit the files
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files"
          git push
